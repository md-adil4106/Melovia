services:
  db:
    image: postgres:16-alpine
    container_name: melovia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: melovia_db
      POSTGRES_USER: melovia_user
      POSTGRES_PASSWORD: melovia_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melovia_user -d melovia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: melovia-api
    restart: unless-stopped
    environment:
      - ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql+psycopg://melovia_user:melovia_password@db:5432/melovia_db
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: melovia-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
